<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紫微斗數排盤</title>
<meta name="theme-color" content="#8b1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="紫微排盤">
<style>
  :root {
    --line: #8a8a8a;
    --bg: #fdfcf8;
    --major: #c0392b;
    --minor: #1f4e9c;
    --adj: #555;
    --lu: #1e9e4a;   /* 祿 */
    --quan: #8e44ad; /* 權 */
    --ke: #2471c8;   /* 科 */
    --ji: #d62c2c;   /* 忌 */
    --birth: #d9483b; /* 生年四化底色 */
    --dec: #3d8b2f;   /* 大限 */
    --year: #2f6fd6;  /* 流年 */
    --month: #7a4fc9; /* 流月 */
    --mlabel: #e08a1e; /* 流月宮位標籤 */
    --boshi: #3a9aa8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #eceae4; color: #222;
    font-family: "Noto Serif TC", "PMingLiU", "Microsoft JhengHei", serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 12px; }

  /* ===== 輸入區 ===== */
  .panel { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .panel h1 { font-size: 18px; margin: 0 0 10px; }
  .form { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .field input[type=text], .field input[type=number], .field select {
    padding: 6px 8px; font-size: 15px; border: 1px solid #bbb; border-radius: 4px; font-family: inherit;
  }
  .field input[type=number] { width: 80px; }
  .field input#name { width: 140px; }
  .radios { display: flex; gap: 10px; padding: 6px 0; }
  .btn { padding: 7px 14px; font-size: 15px; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; cursor: pointer; font-family: inherit; }
  .btn.primary { background: #8b1e1e; color: #fff; border-color: #8b1e1e; }
  .btn:focus-visible, .cell:focus-visible, .palace:focus-visible { outline: 2px solid #2471c8; outline-offset: 1px; }
  .msg { color: var(--ji); font-size: 14px; min-height: 18px; margin-top: 6px; }
  .profiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; font-size: 14px; }
  .slot { display: flex; border: 1px solid #aaa; border-radius: 4px; overflow: hidden; }
  .slot button { border: 0; background: #faf6ec; padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 14px; }
  .slot button.del { background: #f3e0e0; color: #900; padding: 5px 8px; }
  .slot.active button:first-child { background: #8b1e1e; color: #fff; }
  .slot.empty { border-style: dashed; color: #999; padding: 5px 10px; }

  /* ===== 命盤 ===== */
  .chart-scroll { overflow-x: auto; }
  /* ===== 字型切換：命盤內所有字級都用 em，跟著 --fscale 等比縮放 ===== */
  :root { --chart-font: "Noto Serif TC", "PMingLiU", "MingLiU", serif; --fscale: 1; }
  :root[data-font="kai"] { --chart-font: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", "KaiTi", serif; --fscale: 1.06; }
  :root[data-font="hei"] { --chart-font: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; --fscale: 0.96; }
  .fontbar { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 14px; }
  .fontbar button { padding: 4px 12px; font-size: 14px; border: 1px solid #aaa; border-radius: 4px; background: #faf6ec; cursor: pointer; }
  .fontbar button[aria-pressed="true"] { background: #8b1e1e; color: #fff; border-color: #8b1e1e; }
  .fontbar button[data-font="ming"] { font-family: "Noto Serif TC", "PMingLiU", serif; }
  .fontbar button[data-font="kai"] { font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; }
  .fontbar button[data-font="hei"] { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }

  .chart {
    font-family: var(--chart-font); font-size: calc(18px * var(--fscale));
    position: relative; min-width: 960px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, minmax(250px, auto));
    background: var(--bg); border: 2px solid #555;
  }
  .palace {
    position: relative; border: 1px solid var(--line); padding: 4px 5px;
    display: flex; flex-direction: column; cursor: pointer; overflow: hidden;
  }
  /* 三方四正強調：本宮 + 三合 + 對宮 */
  .palace.focus { background: #ffe7b3; }
  .palace.tri { background: #fff4d6; }
  .palace.focus::after, .palace.tri::after {
    content: ''; position: absolute; inset: 2px; pointer-events: none; border-radius: 2px;
  }
  .palace.focus::after { border: 3px solid #d35400; }
  .palace.tri::after { border: 2px solid #c9a227; }
  .palace.focus .pname, .palace.tri .pname { text-decoration: underline; text-underline-offset: 3px; }
  /* 借對宮主星 */
  .borrow { display: flex; gap: 0; align-items: flex-start; border: 1.5px dashed var(--major); border-radius: 3px; padding: 1px 2px; margin-right: 2px; background: rgba(255,255,255,.55); }
  .borrow .borrow-lbl { writing-mode: vertical-rl; text-orientation: upright; font-size: .66em; color: #8b1e1e; letter-spacing: -1px; line-height: 1.05; margin-right: 1px; }
  .borrow .star.major .sn { opacity: .8; }
  /* 天相夾宮：鄰宮四化主星 */
  .borrow.jia { border-color: var(--quan); }
  .borrow.jia .borrow-lbl { color: var(--quan); }
  /* 標籤顏色跟著宮名所屬的運限層 */
  .borrow .borrow-lbl.dec { color: var(--dec); }
  .borrow .borrow-lbl.year { color: var(--year); }
  .borrow .borrow-lbl.month { color: var(--month); }
  /* 祿存：只有落在所選三方四正（本宮、三合、對宮）時才加虛線框 */
  .palace.focus .star.lucun, .palace.tri .star.lucun { border: 1.5px dashed var(--lu); border-radius: 3px; padding: 1px 0; }
  /* 地空、地劫：落在三方四正時框起來，淺灰底 */
  .palace.focus .star.kongjie, .palace.tri .star.kongjie { border: 1.5px solid #888; border-radius: 3px; padding: 1px 0; background: #e6e6e6; }
  .stars { display: flex; flex-wrap: wrap; gap: 2px 0; align-items: flex-start; }
  /* 字級層次：主星 > 輔星 > 雜曜；四化標籤略小於輔星 */
  .star { display: flex; flex-direction: column; align-items: center; min-width: 1.15em; }
  /* 直排星名：負字距讓上下兩字靠近，line-height 1 讓左右星曜靠近 */
  .star .sn { writing-mode: vertical-rl; text-orientation: upright; line-height: 1; letter-spacing: -.12em; }
  .star.major .sn { color: var(--major); font-size: 1.125em; font-weight: bold; }
  .star.minor .sn { color: var(--minor); font-size: .97em; }
  .star.adj .sn { color: var(--minor); font-size: .8em; opacity: .85; }
  .star .br { font-size: .7em; color: #666; height: 1.5em; line-height: 1.5em; }
  /* 四化標籤：字為祿權科忌，底色代表層級（生年/大限/流年/流月） */
  .tag { font-size: .8em; line-height: 1.4; width: 1.45em; text-align: center; border-radius: 3px; color: #fff; margin-top: 2px; }
  .tag.birth { background: var(--birth); } .tag.dec { background: var(--dec); }
  .tag.year { background: var(--year); }   .tag.month { background: var(--month); }
  .tag.self { background: transparent; border: 1px solid; font-size: .66em; line-height: 1.35; width: auto; padding: 0 1px; }
  .tag.self.m0 { color: var(--lu); } .tag.self.m1 { color: var(--quan); }
  .tag.self.m2 { color: var(--ke); } .tag.self.m3 { color: var(--ji); }
  /* 運限流曜：直排，右側對齊 */
  .pmidrow { display: flex; align-items: flex-end; gap: 4px; margin-top: auto; padding-top: 3px; }
  .ages { flex: 1; font-size: .64em; color: #888; line-height: 1.4; }
  .hstars { display: flex; gap: 1px; }
  .hstars span { writing-mode: vertical-rl; text-orientation: upright; font-size: .8em; line-height: 1; letter-spacing: -.12em; }
  .hstars .dec { color: var(--dec); } .hstars .year { color: var(--year); } .hstars .month { color: var(--month); }
  .pbottom { display: flex; align-items: flex-end; gap: 4px; margin-top: 4px; }
  .gods { font-size: .76em; line-height: 1.4; color: #333; white-space: nowrap; }
  .gods .bs { color: var(--boshi); }
  .gods .ml { color: var(--mlabel); margin-left: 4px; }
  .pmid { flex: 1; text-align: right; line-height: 1.25; }
  .range { font-size: .7em; color: #777; }
  .hlabels div { font-size: .875em; }
  .hlabels .dec { color: var(--dec); } .hlabels .year { color: var(--year); } .hlabels .month { color: var(--month); }
  .pname { color: var(--ji); font-size: .97em; font-weight: bold; }
  .body-tag { font-size: .66em; color: #fff; background: var(--major); border-radius: 2px; padding: 0 3px; margin-left: 2px; vertical-align: middle; font-weight: normal; }
  .pright { text-align: center; }
  .cs { font-size: .75em; color: #444; }
  .gz { font-size: 1.125em; line-height: 1.15; }

  .palace.cur-dec { box-shadow: inset 0 0 0 2px var(--dec); }
  .palace.cur-year .gz { color: var(--year); font-weight: bold; }

  .center {
    grid-row: 2 / 4; grid-column: 2 / 4; border: 1px solid var(--line);
    padding: 16px 22px; font-size: .94em; line-height: 1.75; background: #fff;
    display: flex; flex-direction: column; justify-content: center;
  }
  .center h2 { margin: 0 0 6px; text-align: center; font-size: 1.45em; letter-spacing: .2em; }
  .center .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .center .k { color: #777; }
  .pillars { display: flex; gap: 14px; font-size: 1.45em; margin: 4px 0; }
  .pillars div { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .pillars small { font-size: .5em; color: #888; }
  .legend { font-size: .85em; margin-top: 8px; color: #555; line-height: 1.7; }
  .legend b { font-weight: normal; padding: 0 3px; color: #fff; border-radius: 2px; }
  .sel-info { margin-top: 6px; font-size: .93em; }
  .sel-info .dec { color: var(--dec); } .sel-info .year { color: var(--year); } .sel-info .month { color: var(--month); }
  svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ===== 運限選擇 ===== */
  .yun { min-width: 960px; margin-top: 8px; background: #fff; border: 2px solid #555; }
  .yun-row { display: flex; border-top: 1px solid #bbb; }
  .yun-row:first-child { border-top: 0; }
  .yun-head { width: 64px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: bold; background: #ece7da; border-right: 1px solid #bbb; }
  .yun-cells { flex: 1; display: grid; grid-template-columns: repeat(12, 1fr); }
  .cell { border: 0; border-left: 1px solid #ddd; background: #fff; padding: 6px 2px; font-size: 13px; line-height: 1.35; cursor: pointer; font-family: inherit; color: #333; }
  .cell:first-child { border-left: 0; }
  .cell:hover { background: #f6f1e3; }
  .cell.sel { background: #8b1e1e; color: #fff; }
  .cell.now { font-weight: bold; text-decoration: underline; }
  .hint { font-size: 12px; color: #777; margin-top: 6px; }

  /* ===== 財運 / 財庫分析 ===== */
  /* 宮位內的財運 / 財庫按鈕，邊框顏色代表層級 */
  .pbtns { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; position: relative; z-index: 1; }
  .pbtn { font-family: inherit; font-size: 13px; line-height: 1.2; padding: 2px 6px; border-radius: 10px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--birth); color: var(--birth); }
  .pbtn.dec { border-color: var(--dec); color: var(--dec); }
  .pbtn.year { border-color: var(--year); color: var(--year); }
  .pbtn:hover { background: #fff3d6; }
  .pbtn[aria-pressed="true"] { color: #fff; background: var(--birth); }
  .pbtn.dec[aria-pressed="true"] { background: var(--dec); }
  .pbtn.year[aria-pressed="true"] { background: var(--year); }
  .pbtn:focus-visible { outline: 2px solid #2471c8; outline-offset: 1px; }
  .ana { margin-top: 12px; background: #fff; border: 2px solid #555; border-radius: 6px; padding: 14px 16px; min-width: 960px; }
  .ana-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .ana-head h3 { margin: 0; font-size: 19px; }
  .ana-score span { font-size: 30px; font-weight: bold; }
  .ana-score small { font-size: 16px; color: #666; }
  .ana-warn.care { background: #fff4e5; border-color: #c0601a; color: #8a4510; }
  .ana-rating { font-size: 15px; padding: 2px 10px; border-radius: 12px; color: #fff; }
  .r-best { color: #1e7d3a; } .r-good { color: #2e8b57; } .r-mid { color: #b9770e; } .r-weak { color: #c0601a; } .r-bad { color: #c0392b; }
  .ana-rating.r-best, .meter .r-best { background: #1e7d3a; color: #fff; }
  .ana-rating.r-good, .meter .r-good { background: #2e8b57; color: #fff; }
  .ana-rating.r-mid, .meter .r-mid { background: #b9770e; color: #fff; }
  .ana-rating.r-weak, .meter .r-weak { background: #c0601a; color: #fff; }
  .ana-rating.r-bad, .meter .r-bad { background: #c0392b; color: #fff; }
  .meter { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin: 8px 0 10px; }
  .meter div { height: 100%; }
  .ana-warn { background: #fdecea; border: 1px solid #c0392b; color: #a02a1f; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; }
  .ana-body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  .ana-text p { margin: 0 0 8px; line-height: 1.75; font-size: 15px; }
  .ana-table { width: 100%; border-collapse: collapse; font-size: 13.5px; align-self: start; }
  .ana-table th, .ana-table td { border-bottom: 1px solid #e3e3e3; padding: 5px 6px; text-align: left; vertical-align: top; }
  .ana-table th { background: #f3efe4; }
  .ana-table td:last-child, .ana-table th:last-child { text-align: right; white-space: nowrap; }
  .ana-table .pos { color: #1e7d3a; } .ana-table .neg { color: #c0392b; }
  .ana-table tr.sub td { font-weight: bold; border-top: 1px solid #999; }
  .ana-note { font-size: 12px; color: #777; margin: 10px 0 0; line-height: 1.6; }
  .ana-combo { margin-top: 12px; padding: 10px 14px; background: #f7f3e8; border-left: 4px solid #b9770e; border-radius: 4px; }
  .ana-combo h4 { margin: 0 0 6px; font-size: 16px; }
  .ana-combo p { margin: 0 0 6px; line-height: 1.75; font-size: 15px; }
  .ana-domains { margin-top: 12px; }
  .ana-domains h4 { margin: 0 0 8px; font-size: 16px; }
  .ana-domains { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
  .ana-domains h4 { grid-column: 1 / -1; }
  .ana-domains h4 small { font-weight: normal; color: #888; font-size: 12px; margin-left: 6px; }
  .dom { border: 1px solid #e0d8c4; border-radius: 4px; padding: 8px 12px; background: #fffdf7; }
  .dom-h { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .dom-h small { font-weight: normal; color: #888; margin-left: 6px; font-size: 12px; }
  .dom ul { margin: 0; padding-left: 18px; }
  .dom li { line-height: 1.65; font-size: 14px; margin-bottom: 2px; }

  /* ===== 手機版（寬度 ≤ 760px）：命盤維持 4×4，整體縮小；選單與分析改成窄版 ===== */
  @media (max-width: 760px) {
    .wrap { padding: 6px; }
    .panel { padding: 10px; }
    .panel h1 { font-size: 17px; }
    .form { gap: 8px 10px; }
    .field input[type=number] { width: 64px; }
    .field input#name { width: 120px; }
    .field input, .field select { font-size: 16px; } /* 16px 以上 iPhone 才不會自動放大畫面 */
    .btn { padding: 8px 12px; }

    /* 命盤：取消最小寬度，字級跟著螢幕寬度縮放 */
    .chart { min-width: 0; font-size: calc(clamp(8.5px, 2.65vw, 12px) * var(--fscale));
      grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, auto)); border-width: 1px; }
    .palace { padding: 2px; min-height: 9.5em; min-width: 0; }
    .center { min-width: 0; overflow: hidden; }
    .pbottom { flex-wrap: wrap; justify-content: flex-end; }
    .gods { white-space: normal; }
    .palace.focus::after { border-width: 2px; inset: 1px; }
    .palace.tri::after { border-width: 1.5px; inset: 1px; }
    .ages { display: none; }            /* 流年 / 小限歲數：手機上省略 */
    .gods { font-size: .7em; line-height: 1.25; }
    .gods .ml { display: block; margin-left: 0; }
    .pbottom { gap: 2px; }
    .pbtns { gap: 2px; }
    .pbtn { font-size: 10px; padding: 1px 4px; border-width: 1px; }
    .borrow { padding: 0 1px; border-width: 1px; }
    .tag { border-radius: 2px; }

    /* 中宮：精簡 */
    .center { padding: 6px 8px; font-size: .95em; line-height: 1.5; }
    .center h2 { font-size: 1.3em; margin-bottom: 2px; }
    .center .row { gap: 2px 8px; }
    .pillars { gap: 8px; font-size: 1.3em; margin: 2px 0; }
    .legend { font-size: .8em; line-height: 1.5; margin-top: 4px; }

    /* 大限 / 流年 / 流月：改成兩排 */
    .yun { min-width: 0; }
    .yun-head { width: 34px; font-size: 13px; writing-mode: vertical-rl; letter-spacing: 2px; }
    .yun-cells { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; min-width: 0; }
    .chart-scroll { overflow-x: hidden; }
    .form > .field, .profiles, .fontbar { max-width: 100%; }
    .profiles .slot button { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .yun-cells > div.cell { grid-column: 1 / -1 !important; }
    .cell { font-size: 11.5px; padding: 6px 1px; border-top: 1px solid #eee; }
    .hint { font-size: 11px; }

    /* 分析區：單欄 */
    .ana { min-width: 0; padding: 10px; }
    .ana-head { gap: 8px; }
    .ana-head h3 { font-size: 16px; width: 100%; }
    .ana-score span { font-size: 26px; }
    .ana-body { grid-template-columns: 1fr; gap: 10px; }
    .ana-text p, .ana-combo p { font-size: 14px; line-height: 1.7; }
    .ana-table { font-size: 12.5px; }
    .ana-domains { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="panel" aria-label="輸入資料">
    <h1>紫微斗數排盤</h1>
    <form class="form" id="form" autocomplete="off">
      <div class="field"><label for="name">姓名</label><input type="text" id="name" maxlength="20" placeholder="可留空"></div>
      <div class="field"><span>性別</span>
        <div class="radios" role="radiogroup" aria-label="性別">
          <label><input type="radio" name="gender" value="男"> 男</label>
          <label><input type="radio" name="gender" value="女"> 女</label>
        </div>
      </div>
      <div class="field"><span>曆法</span>
        <div class="radios" role="radiogroup" aria-label="曆法">
          <label><input type="radio" name="cal" value="solar" checked> 國曆</label>
          <label><input type="radio" name="cal" value="lunar"> 農曆</label>
        </div>
      </div>
      <div class="field"><label for="y">年</label><input type="number" id="y" min="1900" max="2100"></div>
      <div class="field"><label for="m">月</label><input type="number" id="m" min="1" max="12"></div>
      <div class="field"><label for="d">日</label><input type="number" id="d" min="1" max="31"></div>
      <div class="field" id="leapWrap" hidden><span>&nbsp;</span><label class="radios"><input type="checkbox" id="leap"> 閏月</label></div>
      <div class="field"><label for="t">時辰</label>
        <select id="t">
          <option value="">請選擇</option>
          <option value="0">早子時 00:00~01:00</option>
          <option value="1">丑時 01:00~03:00</option>
          <option value="2">寅時 03:00~05:00</option>
          <option value="3">卯時 05:00~07:00</option>
          <option value="4">辰時 07:00~09:00</option>
          <option value="5">巳時 09:00~11:00</option>
          <option value="6">午時 11:00~13:00</option>
          <option value="7">未時 13:00~15:00</option>
          <option value="8">申時 15:00~17:00</option>
          <option value="9">酉時 17:00~19:00</option>
          <option value="10">戌時 19:00~21:00</option>
          <option value="11">亥時 21:00~23:00</option>
          <option value="12">晚子時 23:00~00:00</option>
        </select>
      </div>
      <button type="submit" class="btn primary">排盤</button>
      <button type="button" class="btn" id="saveBtn">儲存設定</button>
      <button type="button" class="btn" id="clearBtn">清空</button>
    </form>
    <div class="msg" id="msg" role="alert"></div>
    <div class="profiles" id="profiles" aria-label="已儲存設定"></div>
    <div class="fontbar" id="fontbar" role="group" aria-label="命盤字型">
      <span>字型：</span>
      <button type="button" data-font="ming" aria-pressed="true">明體</button>
      <button type="button" data-font="kai" aria-pressed="false">楷體</button>
      <button type="button" data-font="hei" aria-pressed="false">黑體</button>
    </div>
  </section>

  <div id="out"></div>
</div>

<script src="iztro.min.js"></script>
<script>
(() => {
  'use strict';
  const MAX_PROFILES = 5;
  const STORE_KEY = 'ziwei_profiles_v1';
  const MUT = ['祿', '權', '科', '忌'];
  const STEMS = '甲乙丙丁戊己庚辛壬癸';
  const BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
  const MONTHS = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  // 十干四化（祿權科忌），與 iztro 預設一致，用於自化
  const SIHUA = {
    甲: ['廉貞','破軍','武曲','太陽'], 乙: ['天機','天梁','紫微','太陰'],
    丙: ['天同','天機','文昌','廉貞'], 丁: ['太陰','天同','天機','巨門'],
    戊: ['貪狼','太陰','右弼','天機'], 己: ['武曲','貪狼','天梁','文曲'],
    庚: ['太陽','武曲','太陰','天同'], 辛: ['巨門','太陽','文曲','文昌'],
    壬: ['天梁','紫微','左輔','武曲'], 癸: ['破軍','巨門','太陰','貪狼'],
  };
  const SHORT = { 命宮:'命', 兄弟:'兄', 夫妻:'夫', 子女:'子', 財帛:'財', 疾厄:'疾', 遷移:'遷', 僕役:'友', 交友:'友', 官祿:'官', 事業:'官', 田宅:'田', 福德:'福', 父母:'父' };
  // iztro 宮位 index 0 = 寅，逆時針排列；對應 4x4 格子的 [row, col]
  const POS = [[4,1],[3,1],[2,1],[1,1],[1,2],[1,3],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2]];
  // 三方四正連線錨點（百分比座標，落在中宮邊界上）
  const ANCHOR = [[25,75],[25,62.5],[25,37.5],[25,25],[37.5,25],[62.5,25],[75,25],[75,37.5],[75,62.5],[75,75],[62.5,75],[37.5,75]];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const yearGZ = (y) => STEMS[((y - 4) % 10 + 10) % 10] + BRANCHES[((y - 4) % 12 + 12) % 12];
  const branchOfYear = (y) => BRANCHES[((y - 4) % 12 + 12) % 12];
  // 五虎遁：由年干推月干
  const monthGZ = (y, m) => {
    const ys = ((y - 4) % 10 + 10) % 10;
    const start = ((ys % 5) * 2 + 2) % 10;
    return STEMS[(start + m - 1) % 10] + BRANCHES[(m + 1) % 12];
  };

  let state = null; // { astro, input, birthYear, sel: {dec, year, month}, focus, now }
  let activeProfileId = null;

  /* ===== 設定儲存 ===== */
  const loadProfiles = () => {
    try {
      const arr = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(arr) ? arr.slice(0, MAX_PROFILES) : [];
    } catch { return []; }
  };
  const saveProfiles = (arr) => localStorage.setItem(STORE_KEY, JSON.stringify(arr.slice(0, MAX_PROFILES)));

  function renderProfiles() {
    const list = loadProfiles();
    const box = $('profiles');
    let html = `<span>已存設定（${list.length}/${MAX_PROFILES}）：</span>`;
    list.forEach((p) => {
      const label = `${p.name || '未命名'}（${p.cal === 'lunar' ? '農' : '國'}${p.y}/${p.m}/${p.d}）`;
      html += `<div class="slot${p.id === activeProfileId ? ' active' : ''}">
        <button type="button" data-load="${esc(p.id)}" title="載入並排盤">${esc(label)}</button>
        <button type="button" class="del" data-del="${esc(p.id)}" aria-label="刪除 ${esc(p.name || '未命名')}">✕</button></div>`;
    });
    for (let i = list.length; i < MAX_PROFILES; i++) html += `<div class="slot empty">空位</div>`;
    box.innerHTML = html;
  }

  $('profiles').addEventListener('click', (e) => {
    const loadId = e.target.dataset.load, delId = e.target.dataset.del;
    if (loadId) {
      const p = loadProfiles().find((x) => x.id === loadId);
      if (!p) return;
      fillForm(p);
      activeProfileId = p.id;
      renderProfiles();
      draw(p);
    } else if (delId) {
      const p = loadProfiles().find((x) => x.id === delId);
      if (!p || !confirm(`確定刪除「${p.name || '未命名'}」？`)) return;
      saveProfiles(loadProfiles().filter((x) => x.id !== delId));
      if (activeProfileId === delId) activeProfileId = null;
      renderProfiles();
    }
  });

  $('saveBtn').addEventListener('click', () => {
    const input = readForm();
    if (!input) return;
    const list = loadProfiles();
    let idx = list.findIndex((x) => x.id === activeProfileId);
    if (idx >= 0) {
      // 表單內容跟目前載入的設定不同（例如改成 B 的資料）時，先問要覆蓋還是另存，避免誤蓋
      const cur = list[idx];
      const same = ['name', 'gender', 'cal', 'y', 'm', 'd', 'leap', 't'].every((k) => String(cur[k] ?? '') === String(input[k] ?? ''));
      if (!same && !confirm(`目前載入的是「${cur.name || '未命名'}」，表單內容已經不同。\n\n按「確定」覆蓋「${cur.name || '未命名'}」\n按「取消」另存成新的一組`)) {
        idx = -1;
        activeProfileId = null;
      }
    }
    if (idx >= 0) {
      list[idx] = { ...input, id: activeProfileId };
      setMsg(`已更新「${input.name || '未命名'}」`, true);
    } else {
      if (list.length >= MAX_PROFILES) { setMsg(`最多只能存 ${MAX_PROFILES} 組設定，請先刪除一組`); return; }
      activeProfileId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      list.push({ ...input, id: activeProfileId });
      setMsg(`已儲存「${input.name || '未命名'}」`, true);
    }
    saveProfiles(list);
    renderProfiles();
  });

  $('clearBtn').addEventListener('click', () => {
    $('form').reset();
    $('leapWrap').hidden = true;
    activeProfileId = null;
    state = null;
    $('out').innerHTML = '';
    setMsg('');
    renderProfiles();
  });

  /* ===== 表單 ===== */
  document.querySelectorAll('input[name=cal]').forEach((r) =>
    r.addEventListener('change', () => { $('leapWrap').hidden = !document.querySelector('input[name=cal][value=lunar]').checked; }));

  function setMsg(text, ok) { const m = $('msg'); m.textContent = text; m.style.color = ok ? '#1e7d3a' : ''; }

  function fillForm(p) {
    $('name').value = p.name || '';
    document.querySelectorAll('input[name=gender]').forEach((r) => (r.checked = r.value === p.gender));
    document.querySelectorAll('input[name=cal]').forEach((r) => (r.checked = r.value === p.cal));
    $('y').value = p.y; $('m').value = p.m; $('d').value = p.d;
    $('leap').checked = !!p.leap;
    $('leapWrap').hidden = p.cal !== 'lunar';
    $('t').value = String(p.t);
  }

  function readForm() {
    const gender = document.querySelector('input[name=gender]:checked')?.value;
    const cal = document.querySelector('input[name=cal]:checked')?.value || 'solar';
    const y = parseInt($('y').value, 10), m = parseInt($('m').value, 10), d = parseInt($('d').value, 10);
    const tRaw = $('t').value;
    if (!gender) return setMsg('請選擇性別'), null;
    if (!(y >= 1900 && y <= 2100)) return setMsg('年份需介於 1900~2100'), null;
    if (!(m >= 1 && m <= 12)) return setMsg('月份需介於 1~12'), null;
    const maxDay = cal === 'solar' ? new Date(y, m, 0).getDate() : 30;
    if (!(d >= 1 && d <= maxDay)) return setMsg(`日期需介於 1~${maxDay}`), null;
    if (tRaw === '') return setMsg('請選擇時辰'), null;
    setMsg('');
    return { name: $('name').value.trim(), gender, cal, y, m, d, leap: cal === 'lunar' && $('leap').checked, t: parseInt(tRaw, 10) };
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = readForm();
    if (input) draw(input);
  });

  /* ===== 排盤 ===== */
  function lunarToSolar(y, m) {
    // 借用 byLunar 做農曆→國曆換算（取該月十五）
    return iztro.astro.byLunar(`${y}-${m}-15`, 0, '男', false, true, 'zh-TW').solarDate;
  }

  function draw(input) {
    let a;
    try {
      a = input.cal === 'lunar'
        ? iztro.astro.byLunar(`${input.y}-${input.m}-${input.d}`, input.t, input.gender, input.leap, true, 'zh-TW')
        : iztro.astro.bySolar(`${input.y}-${input.m}-${input.d}`, input.t, input.gender, true, 'zh-TW');
    } catch (err) {
      setMsg('排盤失敗：' + err.message);
      return;
    }
    const birthYear = a.rawDates?.lunarDate?.lunarYear ?? input.y;
    const now = a.horoscope(new Date());
    const nowYear = birthYear + now.age.nominalAge - 1;
    const nowMonth = (BRANCHES.indexOf(now.monthly.earthlyBranch) - 2 + 12) % 12 + 1;
    const soulIdx = a.palaces.findIndex((p) => p.name === '命宮');
    // 一開始只顯示本命盤，點選大限 / 流年 / 流月後才依序疊加
    state = { astro: a, input, birthYear, focus: soulIdx, now: { year: nowYear, month: nowMonth }, sel: { dec: null, year: null, month: null }, h: null };
    render();
  }

  function selectDecade(idx) {
    // 再點一次已選的大限 = 回到本命盤
    state.sel = state.sel.dec === idx ? { dec: null, year: null, month: null } : { dec: idx, year: null, month: null };
    computeAndRender();
  }

  function sortedDecades() {
    return state.astro.palaces.map((p, i) => i).sort((x, y) => state.astro.palaces[x].decadal.range[0] - state.astro.palaces[y].decadal.range[0]);
  }

  function computeAndRender() {
    const { sel, astro: a, birthYear } = state;
    if (sel.dec == null) { state.h = null; render(); return; }
    let y, m = 1;
    if (sel.year != null) { y = sel.year; m = sel.month ?? 1; }
    else y = birthYear + a.palaces[sel.dec].decadal.range[0] - 1;
    try {
      state.h = a.horoscope(lunarToSolar(y, m), state.input.t);
    } catch (err) {
      setMsg('運限計算失敗：' + err.message);
      state.h = null;
    }
    render();
  }

  /* ===== 繪製 ===== */
  function scopes() {
    const { h, sel } = state;
    if (!h) return [];
    const list = [{ key: 'dec', pre: '大', title: '大限', data: h.decadal }];
    if (sel.year != null) list.push({ key: 'year', pre: '年', title: '流年', data: h.yearly });
    if (sel.month != null) list.push({ key: 'month', pre: '月', title: '流月', data: h.monthly });
    return list;
  }

  function starHTML(s, cls, palace, sc) {
    let tags = '';
    if (s.mutagen) tags += `<span class="tag birth" title="生年化${s.mutagen}">${s.mutagen}</span>`;
    sc.forEach(({ key, title, data }) => {
      const k = data.mutagen.indexOf(s.name);
      if (k >= 0) tags += `<span class="tag ${key}" title="${title}化${MUT[k]}">${MUT[k]}</span>`;
    });
    const self = SIHUA[palace.heavenlyStem]?.indexOf(s.name);
    if (self >= 0) tags += `<span class="tag self m${self}" title="自化${MUT[self]}">↑${MUT[self]}</span>`;
    if (s.name === '祿存') cls += ' lucun';
    if (s.name === '地空' || s.name === '地劫') cls += ' kongjie';
    return `<div class="star ${cls}"><span class="sn">${esc(s.name)}</span><span class="br">${esc(s.brightness || '')}</span>${tags}</div>`;
  }

  function palaceHTML(p, i, sc) {
    const { sel, birthYear } = state;
    const tri = [(state.focus + 4) % 12, (state.focus + 6) % 12, (state.focus + 8) % 12];
    const inTri = i === state.focus || tri.includes(i);

    // 宮名以目前最上層運限為準（月 > 年 > 大 > 本命），借 / 夾的稱呼才會跟著運限走
    const nameAt = (j) => {
      const top = sc[sc.length - 1];
      const full = top ? top.data.palaceNames[j] : state.astro.palaces[j].name;
      return { short: SHORT[full] || full, full: (top ? top.title : '本命') + full, key: top ? top.key : '' };
    };

    // 三方四正中若本宮無主星，借對宮主星（含四化）並以虛線框區隔
    let borrowed = '';
    if (inTri && p.majorStars.length === 0) {
      const oj = (i + 6) % 12, op = state.astro.palaces[oj], on = nameAt(oj);
      if (op.majorStars.length) {
        borrowed = `<div class="borrow" title="借對宮（${esc(on.full)}）主星">
          <span class="borrow-lbl ${on.key}">借${esc(on.short)}</span>
          ${op.majorStars.map((s) => starHTML(s, 'major', op, sc)).join('')}</div>`;
      }
    }

    // 三方四正中有天相：拉進左右鄰宮「有四化」的主星（生年 + 目前疊加的運限），以虛線框區隔
    let jia = '';
    if (inTri && p.majorStars.some((s) => s.name === '天相')) {
      const hasMut = (s) => !!s.mutagen || sc.some(({ data }) => data.mutagen.includes(s.name));
      jia = [(i + 11) % 12, (i + 1) % 12].map((j) => {
        const np = state.astro.palaces[j], nn = nameAt(j);
        // 主星 + 輔星都看（化忌可能落在文昌、文曲）
        const list = [...np.majorStars.map((s) => [s, 'major']), ...np.minorStars.map((s) => [s, 'minor'])].filter(([s]) => hasMut(s));
        if (!list.length) return '';
        return `<div class="borrow jia" title="天相夾宮：鄰宮（${esc(nn.full)}）四化星">
          <span class="borrow-lbl ${nn.key}">夾${esc(nn.short)}</span>
          ${list.map(([s, c]) => starHTML(s, c, np, sc)).join('')}</div>`;
      }).join('');
    }

    const stars = borrowed + [
      ...p.majorStars.map((s) => starHTML(s, 'major', p, sc)),
      jia,
      ...p.minorStars.map((s) => starHTML(s, 'minor', p, sc)),
      ...p.adjectiveStars.map((s) => starHTML(s, 'adj', p, sc)),
    ].join('');

    // 運限流曜：iztro 名稱為「運馬 / 流喜 / 月羊」，改成「大馬 / 年喜 / 月羊」；直排，流月→流年→大限由左到右
    const hstars = [...sc].reverse().map(({ key, pre, data }) => (data.stars?.[i] || []).map((s) => {
      const base = /^[運流月]/.test(s.name) && s.name.length > 1 ? s.name.slice(1) : s.name;
      return `<span class="${key}" title="${esc(s.name)}">${pre}${esc(base)}</span>`;
    }).join('')).join('');

    // 流年歲數：該宮地支 = 流年地支
    const lnAges = [];
    for (let age = 1; age <= 120 && lnAges.length < 6; age++) if (branchOfYear(birthYear + age - 1) === p.earthlyBranch) lnAges.push(age);

    // 運限宮名：由上而下 月 → 年 → 大，最下方為本命宮名
    const hl = [...sc].reverse().map(({ key, pre, data }) => `<div class="${key}">${pre}${esc(SHORT[data.palaceNames[i]] || data.palaceNames[i])}</div>`).join('');

    // 流月標籤：選了流年後，標出每宮對應的流月（月份 + 月干）
    let mlabel = '';
    if (sel.year != null && state.h) {
      const idx1 = (state.h.monthly.index - ((sel.month ?? 1) - 1) + 12) % 12; // 正月流月命宮所在
      const m = (i - idx1 + 12) % 12 + 1;
      mlabel = `<span class="ml">${MONTHS[m - 1]}${monthGZ(sel.year, m)[0]}</span>`;
    }

    // 財帛 / 田宅宮位的分析按鈕：本命、大限、流年各自的財 / 田都有一顆
    const anaLayers = [{ key: 'birth', pre: '本', names: state.astro.palaces.map((x) => x.name) }]
      .concat(sc.filter((x) => x.key !== 'month').map((x) => ({ key: x.key, pre: x.pre, names: x.data.palaceNames })));
    const anaBtns = anaLayers.flatMap((L) => [['財帛', 'wealth', '財運'], ['田宅', 'vault', '財庫']]
      .filter(([nm]) => L.names[i] === nm)
      .map(([, kind, t]) => {
        const on = state.ana && state.ana.kind === kind && state.ana.layer === L.key;
        return `<button type="button" class="pbtn ${L.key}" data-ana="${kind}" data-layer="${L.key}" aria-pressed="${!!on}"
          title="計算${L.pre === '本' ? '本命' : L.pre === '大' ? '大限' : '流年'}${t}分數">${L.pre}${t}</button>`;
      })).join('');

    const cls = ['palace'];
    if (i === state.focus) cls.push('focus'); else if (tri.includes(i)) cls.push('tri');
    if (state.h && state.h.decadal.index === i) cls.push('cur-dec');
    if (sel.year != null && state.h && state.h.yearly.index === i) cls.push('cur-year');

    const [r, c] = POS[i];
    return `<div class="${cls.join(' ')}" style="grid-row:${r};grid-column:${c}" data-palace="${i}" tabindex="0"
              aria-label="${esc(p.name)}宮 ${esc(p.heavenlyStem + p.earthlyBranch)}">
      <div class="stars">${stars}</div>
      ${anaBtns ? `<div class="pbtns">${anaBtns}</div>` : ''}
      <div class="pmidrow">
        <div class="ages">流年 ${lnAges.join(',')}<br>小限 ${p.ages.slice(0, 6).join(',')}</div>
        <div class="hstars">${hstars}</div>
      </div>
      <div class="pbottom">
        <div class="gods"><span class="bs">${esc(p.boshi12)}</span><br>${esc(p.jiangqian12)}<br>${esc(p.suiqian12)}${mlabel}</div>
        <div class="pmid">
          <div class="range">${p.decadal.range[0]}~${p.decadal.range[1]}</div>
          <div class="hlabels">${hl}</div>
          <div class="pname">${esc(p.name)}${p.isBodyPalace ? '<span class="body-tag">身</span>' : ''}</div>
        </div>
        <div class="pright"><div class="cs">${esc(p.changsheng12)}</div><div class="gz">${esc(p.heavenlyStem)}<br>${esc(p.earthlyBranch)}</div></div>
      </div>
    </div>`;
  }

  function centerHTML() {
    const { astro: a, input, sel, h, birthYear } = state;
    const yinyang = '甲丙戊庚壬'.includes(a.chineseDate[0]) ? '陽' : '陰';
    const pillars = a.chineseDate.split(' ');
    const pLabel = ['年', '月', '日', '時'];
    let selInfo = '';
    if (h && sel.dec != null) {
      const dp = a.palaces[sel.dec];
      selInfo += `<span class="dec">大限 ${dp.decadal.range[0]}~${dp.decadal.range[1]}（${dp.heavenlyStem}${dp.earthlyBranch}）</span>`;
      if (sel.year != null) selInfo += `　<span class="year">流年 ${sel.year}（${yearGZ(sel.year)}）${sel.year - birthYear + 1}歲</span>`;
      if (sel.month != null) selInfo += `　<span class="month">流月 ${MONTHS[sel.month - 1]}（${monthGZ(sel.year, sel.month)}）</span>`;
    }
    return `<div class="center">
      <h2>紫微斗數</h2>
      <div class="row"><span><span class="k">姓名：</span>${esc(input.name || '匿名')}</span><span>${yinyang}${esc(a.gender)}</span><span>${esc(a.fiveElementsClass)}</span></div>
      <div><span class="k">國曆：</span>${esc(a.solarDate)}　${esc(a.time)}（${esc(a.timeRange)}）</div>
      <div><span class="k">農曆：</span>${esc(a.lunarDate)}</div>
      <div class="pillars">${pillars.map((g, k) => `<div><span>${esc(g[0])}</span><span>${esc(g[1])}</span><small>${pLabel[k]}</small></div>`).join('')}</div>
      <div class="row"><span><span class="k">命主：</span>${esc(a.soul)}</span><span><span class="k">身主：</span>${esc(a.body)}</span><span><span class="k">生肖：</span>${esc(a.zodiac)}</span><span><span class="k">星座：</span>${esc(a.sign)}</span></div>
      <div class="sel-info">${selInfo}</div>
      <div class="legend">四化底色：<b style="background:var(--birth)">生年</b> <b style="background:var(--dec)">大限</b> <b style="background:var(--year)">流年</b> <b style="background:var(--month)">流月</b>
        　框線字 ↑ = 自化　<span style="border:1.5px dashed var(--major);padding:0 3px;border-radius:3px">借</span> = 借對宮主星　<span style="border:1.5px dashed var(--quan);padding:0 3px;border-radius:3px">夾</span> = 天相夾宮四化星　<span style="border:1.5px dashed var(--lu);padding:0 3px;border-radius:3px;color:var(--minor)">祿存</span>　<span style="color:var(--dec)">大</span>/<span style="color:var(--year)">年</span>/<span style="color:var(--month)">月</span> = 運限</div>
    </div>`;
  }

  function linesSVG() {
    const f = state.focus;
    const pt = (i) => ANCHOR[i].join(',');
    const tri = [f, (f + 4) % 12, (f + 8) % 12].map(pt).join(' ');
    const [ox, oy] = ANCHOR[(f + 6) % 12], [fx, fy] = ANCHOR[f];
    return `<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="${tri}" fill="none" stroke="#c9a227" stroke-width="0.25" stroke-dasharray="1,0.6"/>
      <line x1="${fx}" y1="${fy}" x2="${ox}" y2="${oy}" stroke="#c9a227" stroke-width="0.25" stroke-dasharray="1,0.6"/>
    </svg>`;
  }

  function yunHTML() {
    const { astro: a, sel, birthYear, now } = state;
    const decCells = sortedDecades().map((i) => {
      const p = a.palaces[i];
      const isNow = (now.year - birthYear + 1) >= p.decadal.range[0] && (now.year - birthYear + 1) <= p.decadal.range[1];
      return `<button type="button" class="cell${sel.dec === i ? ' sel' : ''}${isNow ? ' now' : ''}" data-dec="${i}">${p.decadal.range[0]}~${p.decadal.range[1]}<br>${p.heavenlyStem}${p.earthlyBranch}限</button>`;
    }).join('');

    let yearCells = '';
    if (sel.dec != null) {
      const [s, e] = a.palaces[sel.dec].decadal.range;
      for (let age = s; age <= e; age++) {
        const y = birthYear + age - 1;
        yearCells += `<button type="button" class="cell${sel.year === y ? ' sel' : ''}${now.year === y ? ' now' : ''}" data-year="${y}">${y}年<br>${yearGZ(y)} ${age}歲</button>`;
      }
    }

    let monthCells = '';
    if (sel.year != null) {
      monthCells = MONTHS.map((name, k) => {
        const m = k + 1;
        const isNow = now.year === sel.year && now.month === m;
        return `<button type="button" class="cell${sel.month === m ? ' sel' : ''}${isNow ? ' now' : ''}" data-month="${m}">${name}<br>${monthGZ(sel.year, m)}</button>`;
      }).join('');
    }

    return `<div class="yun">
      <div class="yun-row"><div class="yun-head">大限</div><div class="yun-cells">${decCells}</div></div>
      <div class="yun-row"><div class="yun-head">流年</div><div class="yun-cells" style="grid-template-columns:repeat(10,1fr)">${yearCells || '<div class="cell" style="grid-column:1/11;cursor:default">請先選擇大限</div>'}</div></div>
      <div class="yun-row"><div class="yun-head">流月</div><div class="yun-cells">${monthCells || '<div class="cell" style="grid-column:1/13;cursor:default">請先選擇流年</div>'}</div></div>
    </div>
    <div class="hint">預設只顯示本命盤。點宮位可切換三方四正；依序點選大限 / 流年 / 流月可疊加運限四化與流曜，再點一次已選的項目可取消該層。粗體底線為當前時間。</div>`;
  }

  /* ===== 財運 / 財庫分析 ===== */
  const SHA = ['擎羊', '陀羅', '火星', '鈴星'];
  const PALACE_MEAN = {
    命宮: '自己的能力與主動', 兄弟: '兄弟、合夥人、同儕', 夫妻: '配偶、感情對象', 子女: '子女、合夥投資、晚輩',
    財帛: '本業收入與理財', 疾厄: '身體、勞力付出', 遷移: '外地、出外發展、外部環境', 僕役: '朋友、人脈、客戶、部屬', 交友: '朋友、人脈、客戶、部屬',
    官祿: '工作、事業', 事業: '工作、事業', 田宅: '家庭、不動產、存款', 福德: '心態、享受、嗜好花費', 父母: '長輩、上司、公家與文書',
  };
  const STAR_MEAN = {
    紫微: '主導、格局', 天機: '計畫、變動、技術', 太陽: '名聲、公開、付出', 武曲: '正財、金融、執行', 天同: '享福、隨緣',
    廉貞: '公關、規範、官非', 天府: '庫存、守成', 太陰: '儲蓄、穩定收入、不動產', 貪狼: '慾望、交際、投機',
    巨門: '口才、是非、競爭', 天相: '印信、契約、協調', 天梁: '長輩庇蔭、保險、化解', 七殺: '衝刺、開創', 破軍: '破舊立新、大起大落',
    文昌: '文書、合約', 文曲: '口才、才藝、文書',
  };
  const ANA = { wealth: { target: '財帛', title: '財運', role: '看錢從哪來、賺不賺得到' }, vault: { target: '田宅', title: '財庫', role: '看存不存得住、資產與不動產' } };
  const fmt = (n) => (Math.round(n * 10) / 10).toString();
  const TANLANG_LU = 50; // 貪狼化祿特例分數
  const BASE = 0;        // 基準分數

  // kind：wealth（財帛）/ vault（田宅）；upto：算到哪一層（birth / dec / year）
  function analyze(kind, upto) {
    const { astro: a, h, sel } = state;
    const cfg = ANA[kind];
    // 計分層：生年一定算；大限、流年依按下的按鈕層級加入（流月不計分）
    const layers = [{ key: 'birth', title: '生年', mut: SIHUA[a.chineseDate[0]] || [] }];
    if (h && sel.dec != null && (upto === 'dec' || upto === 'year')) layers.push({ key: 'dec', title: '大限', mut: h.decadal.mutagen, stars: h.decadal.stars, lucun: '運祿', names: h.decadal.palaceNames });
    if (h && sel.year != null && upto === 'year') layers.push({ key: 'year', title: '流年', mut: h.yearly.mutagen, stars: h.yearly.stars, lucun: '流祿', names: h.yearly.palaceNames });
    const top = layers[layers.length - 1];
    const topNames = top.names || a.palaces.map((p) => p.name);
    const f = topNames.indexOf(cfg.target);
    const tri = [f, (f + 4) % 12, (f + 8) % 12, (f + 6) % 12];
    const ROLE = ['本宮', '三合', '三合', '對宮'];

    // 宮位描述：地支 + 各層宮名
    const pname = (j) => {
      const parts = [`本命${a.palaces[j].name}`];
      layers.forEach((L) => { if (L.names) parts.push(`${L.title}${L.names[j]}`); });
      return `${a.palaces[j].earthlyBranch}宮（${parts.join('／')}）`;
    };
    const meanOf = (j) => {
      const nm = topNames[j];
      return `${PALACE_MEAN[nm] || nm}（${top.names ? top.title : '本命'}${nm}）`;
    };
    const starsOf = (p) => [...p.majorStars, ...p.minorStars, ...p.adjectiveStars];

    const items = [];   // 計分項目 { pts, label, where, kind, via, from }
    const softs = [];   // 權、科（不計分，只寫入解讀）
    const sha = [];
    let kong = false, jie = false;

    const scan = (stars, j, factor, via, from) => {
      stars.forEach((s) => layers.forEach((L) => {
        const k = L.mut.indexOf(s.name);
        if (k < 0) return;
        const viaTxt = via === 'borrow' ? `（借${a.palaces[from].name}，折半）` : via === 'jia' ? `（天相夾，來自${pname(from)}）` : '';
        const label = `${s.name}${L.title}化${MUT[k]}`;
        if (k === 0) items.push({ pts: (s.name === '貪狼' ? TANLANG_LU : 5) * factor, label: label + (s.name === '貪狼' ? '（特例）' : ''), where: pname(j) + viaTxt, kind: 'lu', star: s.name, via, from, j });
        else if (k === 3) items.push({ pts: -5 * factor, label, where: pname(j) + viaTxt, kind: 'ji', star: s.name, via, from, j });
        else if (via !== 'jia') softs.push({ label, star: s.name, k, j });
      }));
    };

    tri.forEach((j) => {
      const p = a.palaces[j];
      const own = starsOf(p);
      scan(own, j, 1, 'own');
      // 祿存：本命 + 大限 / 流年祿存
      if (own.some((s) => s.name === '祿存')) items.push({ pts: 3, label: '祿存', where: pname(j), kind: 'lucun', via: 'own', j });
      layers.forEach((L) => {
        if (L.stars && (L.stars[j] || []).some((s) => s.name === L.lucun)) items.push({ pts: 3, label: `${L.title}祿存`, where: pname(j), kind: 'lucun', via: 'own', j });
      });
      own.forEach((s) => {
        if (s.name === '地空') kong = true;
        if (s.name === '地劫') jie = true;
        if (SHA.includes(s.name)) sha.push(`${s.name}在${pname(j)}`);
      });
      // 空宮借對宮主星，四化分數折半（對宮也在三方四正時，對宮全額 + 借入折半都要算）
      if (!p.majorStars.length) {
        const oj = (j + 6) % 12;
        if (a.palaces[oj].majorStars.length) scan(a.palaces[oj].majorStars, j, 0.5, 'borrow', oj);
      }
      // 天相吸左右鄰宮的祿、忌
      if (p.majorStars.some((s) => s.name === '天相')) {
        [(j + 11) % 12, (j + 1) % 12].forEach((n) => scan([...a.palaces[n].majorStars, ...a.palaces[n].minorStars], j, 1, 'jia', n));
      }
    });

    const raw = BASE + items.reduce((t, x) => t + x.pts, 0);
    const kj = kong || jie;
    const score = kj ? (raw > 0 ? raw * 0.3 : raw < 0 ? raw * 1.7 : 0) : raw;

    // 雙忌警示（財帛：金流吃緊／田宅：財庫漏財）
    const big = [];
    // 地空 + 地劫：標示「特別留意」
    const care = kong && jie ? ['三方四正同時有地空、地劫'] : [];
    // 化忌數（雙忌判斷）：三方四正內 + 借進來的忌；同一顆星同一層的忌只算一個
    const jiCount = new Set(items.filter((x) => x.kind === 'ji' && x.via !== 'jia').map((x) => x.label)).size;
    if (layers.some((L) => L.key === 'dec') && jiCount >= 2) big.push(`大限層級，三方四正有 ${jiCount} 個化忌`);

    return { kind, layerKey: upto, cfg, layers, top, f, tri, ROLE, pname, meanOf, items, softs, sha, kong, jie, raw, score, big, care, jiCount };
  }

  // 評語分級；tone：good / mid / bad（綜合解讀用）
  function rateOf(r) {
    // 雙忌：財帛（金流）＝金流吃緊；田宅（財庫，累積的家底）＝財庫漏財
    const bigName = r.kind === 'vault' ? '財庫漏財' : '金流吃緊';
    const s = r.score;
    if (r.big.length) return { rating: bigName, rcls: 'r-bad', tone: 'bad', bigName };
    if (r.care.length) return { rating: '特別留意', rcls: 'r-weak', tone: 'bad', bigName };
    // 基準 0：負分破財；之後依總分分級（一個化祿 = 5）
    if (s < 0) return { rating: '破財', rcls: 'r-bad', tone: 'bad', bigName };
    if (s < 3) return { rating: '偏弱', rcls: 'r-weak', tone: 'mid', bigName };
    if (s < 8) return { rating: '平穩', rcls: 'r-mid', tone: 'mid', bigName };
    if (s < 15) return { rating: '良好', rcls: 'r-good', tone: 'good', bigName };
    return { rating: '旺', rcls: 'r-best', tone: 'good', bigName };
  }

  // 分析的期間標籤：2027 年（丁未）／大限 32~41 歲（戊子）／本命
  function periodOf(layer) {
    const { sel, astro: a } = state;
    if (layer === 'year' && sel.year != null) return `${sel.year} 年（${yearGZ(sel.year)}）`;
    if (layer === 'dec' && sel.dec != null) {
      const p = a.palaces[sel.dec];
      return `大限 ${p.decadal.range[0]}~${p.decadal.range[1]} 歲（${p.heavenlyStem}${p.earthlyBranch}）`;
    }
    return '本命';
  }

  // 財運 + 財庫綜合解讀
  function comboHTML(r, o) {
    const w = r.kind === 'wealth' ? r : o, v = r.kind === 'vault' ? r : o;
    const wr = rateOf(w), vr = rateOf(v);
    // 列出某一邊的化忌來源：哪顆星、落在哪個領域
    const jiCauses = (x) => x.items.filter((i) => i.kind === 'ji').map((i) => {
      const j = i.via === 'jia' ? i.from : i.j;
      return `${esc(i.label)}在${esc(x.meanOf(j))}${STAR_MEAN[i.star] ? `（${esc(STAR_MEAN[i.star])}）` : ''}`;
    });
    const luSrc = (x) => x.items.filter((i) => i.kind === 'lu').map((i) => {
      const j = i.via === 'jia' ? i.from : i.j;
      return `${esc(i.label)}（${esc(x.meanOf(j))}）`;
    });
    const head = `財運 ${w.score > 0 ? '+' : ''}${fmt(w.score)}（${wr.rating}）、財庫 ${v.score > 0 ? '+' : ''}${fmt(v.score)}（${vr.rating}）`;
    let body;
    if (wr.tone === 'good' && vr.tone === 'bad') {
      body = '賺得到錢，但要留意累積下來的資產被消耗掉，例如為了家裡或房子花大錢，或者動用到長期存下來的部位。';
    } else if (wr.tone === 'bad' && vr.tone === 'good') {
      body = '金流偏緊，但家底還在。短期周轉可能要動到存款，重點是別讓「暫時借用老本」變成長期吃老本。';
    } else if (wr.tone === 'good' && vr.tone === 'good') {
      body = '進得來也存得住，是累積資產的好時機，可以把賺到的錢有計畫地轉成長期資產。';
    } else if (wr.tone === 'bad' && vr.tone === 'bad') {
      body = '金流和家底都有壓力，以守為主：控制支出、不動老本、避免借貸與作保。';
    } else if (wr.tone === 'good') {
      body = '賺錢的條件不錯，財庫普通。賺到的錢要主動存下來，不然容易留不住。';
    } else if (vr.tone === 'good') {
      body = '進帳普通，但家底穩。適合守成、慢慢累積，不必急著開源。';
    } else {
      body = '財運、財庫都在平穩區間，沒有明顯的大起大落，穩健操作即可。';
    }
    const extra = [];
    if (wr.tone === 'good' && luSrc(w).length) extra.push(`錢的來源：${luSrc(w).join('、')}`);
    if (vr.tone === 'bad' && jiCauses(v).length) extra.push(`家底被消耗的原因：${jiCauses(v).join('；')}`);
    if (wr.tone === 'bad' && jiCauses(w).length) extra.push(`金流卡住的原因：${jiCauses(w).join('；')}`);
    return `<div class="ana-combo"><h4>${esc(periodOf(r.layerKey))} 財運＋財庫綜合解讀</h4>
      <p>${head}。${body}</p>${extra.map((t) => `<p>${t}。</p>`).join('')}</div>`;
  }

  /* ===== 分面向解讀：工作、股市、房產，輔以貴人與破財可能性 ===== */
  const GUIREN = ['天魁', '天鉞', '左輔', '右弼'];
  // 貴人星代表的人
  const GUI_WHO = {
    天魁: '年長男性、上司或長輩型的貴人，明面上提拔你',
    天鉞: '女性或異性貴人，常在背後默默幫忙',
    左輔: '同輩的男性助力，例如同事、平輩朋友，實際出力幫忙',
    右弼: '同輩的女性助力或幕後協調者，幫你牽線、打圓場',
  };
  // 化科星代表的人
  const KE_WHO = {
    文昌: '老師、學者或文書專業人士（會計、律師、代書）', 文曲: '口才好、有才藝的人，或文書、教育相關人士',
    太陰: '女性貴人（母親、姊妹、女性長官）', 太陽: '男性貴人（父親、兄長、男性長官）',
    天機: '顧問、技術或專業人士，給你點子與方向', 紫微: '有地位、有權力的人',
    天梁: '長輩、公家機關或醫療、保險相關人士', 武曲: '金融、財務專業人士',
    右弼: '同輩女性或幕後協調者', 左輔: '同輩男性或同事', 天府: '穩重、有資源的長輩',
  };
  // 宮位代表的對象
  const PALACE_WHO = {
    命宮: '你主動結識，或憑自身條件吸引來的人', 兄弟: '兄弟姊妹、合夥人、同事同儕', 夫妻: '配偶、伴侶或另一半的人脈',
    子女: '子女、晚輩、學生或合夥投資的對象', 財帛: '客戶、金主，或在錢的事情上出手的人', 疾厄: '醫生、照護你的人，或在你辛苦勞累時出現的人',
    遷移: '外地、出差、出國時遇到的人', 僕役: '朋友、部屬、客戶', 交友: '朋友、部屬、客戶',
    官祿: '上司、主管或工作上的合作對象', 事業: '上司、主管或工作上的合作對象', 田宅: '家人、房東、鄰居或房仲',
    福德: '興趣圈的朋友、精神上的導師或祖輩', 父母: '父母、上司、長官、老師或公家機關',
  };
  // 掃描某宮的訊號（本宮星 + 空宮借對宮主星）
  function sigOf(r, j) {
    const a = state.astro, p = a.palaces[j];
    const out = { lu: [], quan: [], ke: [], ji: [], kong: false, jie: false, sha: [], gui: [], lucun: false, majors: p.majorStars.map((s) => s.name) };
    const scanStars = (stars, borrowed) => stars.forEach((s) => r.layers.forEach((L) => {
      const k = L.mut.indexOf(s.name);
      if (k < 0) return;
      const t = `${s.name}${L.title}化${MUT[k]}${borrowed ? '（借）' : ''}`;
      [out.lu, out.quan, out.ke, out.ji][k].push(t);
    }));
    const own = [...p.majorStars, ...p.minorStars, ...p.adjectiveStars];
    scanStars(own, false);
    if (!p.majorStars.length) scanStars(a.palaces[(j + 6) % 12].majorStars, true);
    own.forEach((s) => {
      if (s.name === '地空') out.kong = true;
      if (s.name === '地劫') out.jie = true;
      if (s.name === '祿存') out.lucun = true;
      if (SHA.includes(s.name)) out.sha.push(s.name);
      if (GUIREN.includes(s.name)) out.gui.push(s.name);
    });
    return out;
  }
  const namesOf = (r) => r.top.names || state.astro.palaces.map((p) => p.name);
  const idxOf = (r, nm) => namesOf(r).indexOf(nm);

  function domainsHTML(r, o) {
    const w = r.kind === 'wealth' ? r : o, v = r.kind === 'vault' ? r : o;
    const wt = rateOf(w).tone, vt = rateOf(v).tone;
    const L = (arr) => arr.map(esc).join('、');
    const sec = [];

    // --- 工作：官祿宮（在財帛三方內，主收入來源） ---
    const gj = idxOf(w, '官祿') >= 0 ? idxOf(w, '官祿') : idxOf(w, '事業');
    if (gj >= 0) {
      const g = sigOf(w, gj), t = [];
      if (g.lu.length) t.push(`${L(g.lu)}：工作能直接帶來收入，有加薪、獎金或接案的機會`);
      if (g.quan.length) t.push(`${L(g.quan)}：責任加重，有主導專案或升遷的機會`);
      if (g.ke.length) t.push(`${L(g.ke)}：名聲、證照、考核有利，容易被看見`);
      if (g.ji.length) t.push(`${L(g.ji)}：工作壓力大，容易有變動、是非或績效卡關，收入可能受影響`);
      if (g.kong || g.jie) t.push(`${g.kong && g.jie ? '地空、地劫' : g.kong ? '地空' : '地劫'}：計畫容易落空、收入不穩，避免衝動轉職或創業`);
      if (g.sha.length) t.push(`${L(g.sha)}：競爭多、做得辛苦`);
      if (!t.length) t.push('官祿宮沒有明顯四化，工作偏平穩，收入以現狀為主');
      sec.push(['工作', esc(w.meanOf(gj)), t]);
    }

    // --- 股市：看財帛（金流、可操作資金）+ 福德（投機心態） ---
    {
      const t = [];
      const kj = w.kong || w.jie;
      if (wt === 'good' && !kj) t.push('財運有支撐，可依原本的計畫操作，以紀律為主');
      else if (wt === 'good' && kj) t.push('帳面有獲利機會，但三方四正有地空或地劫，獲利容易回吐：賺到要落袋，不追高');
      else if (wt === 'mid') t.push('進帳力道普通，適合定期定額、長期持有，不適合短線重押');
      else if (w.big.length) t.push('金流吃緊，可操作的資金少：避免融資、槓桿，保留現金');
      else if (w.care.length) t.push('三方四正同時有地空、地劫：操作容易虛耗、看對做錯，避免投機與重押');
      else t.push('扣分大於加分，控制部位大小，先求不虧');
      if (w.items.some((x) => x.kind === 'lu' && x.star === '貪狼')) t.push('貪狼化祿帶動：題材、投機性的機會多，但貪狼也主慾望，留意過度交易');
      const fj = idxOf(w, '福德');
      if (fj >= 0) {
        const fd = sigOf(w, fj);
        if (fd.ji.length) t.push(`福德有${L(fd.ji)}：心態容易焦慮，容易追高殺低`);
        else if (fd.lu.length) t.push(`福德有${L(fd.lu)}：心態穩、比較抱得住`);
        if (fd.kong || fd.jie) t.push('福德有地空或地劫：想法容易天馬行空，判斷要有依據');
      }
      sec.push(['股市', '財帛＋福德', t]);
    }

    // --- 房產：田宅本宮為主，搭配同期財運看付款能力 ---
    {
      const tj = v.f, td = sigOf(v, tj), t = [];
      if (td.ji.length) t.push(`${L(td.ji)}坐田宅：房產容易有合約、產權、修繕或家庭方面的糾紛，不宜急著置產；要買就仔細查合約與產權`);
      else if (td.lu.length) t.push(`${L(td.lu)}進田宅：置產、房產帶財的條件好`);
      else if (vt === 'good') t.push('田宅本宮沒有祿忌，但三方四正有支撐，家底穩，可依財務條件評估置產');
      else if (vt === 'bad') t.push('財庫壓力大，家底容易被消耗，置產宜保守');
      else t.push('田宅本宮沒有祿忌，條件中性，以實際財務狀況為準');
      if (td.lucun) t.push('祿存坐田宅：守得住、適合長期持有');
      if (td.kong || td.jie) t.push('地空或地劫坐田宅：房產容易虛耗、縮水，避免投機性買房');
      if (td.majors.some((n) => ['天府', '太陰', '武曲'].includes(n))) t.push(`${L(td.majors.filter((n) => ['天府', '太陰', '武曲'].includes(n)))}坐田宅：庫星或財星，利守成置產`);
      if (td.majors.some((n) => ['破軍', '七殺'].includes(n))) t.push('破軍或七殺坐田宅：房產容易變動、換屋');
      if (wt === 'bad') t.push('同期財運有壓力，房貸月付要保守估算、留足周轉金');
      else if (wt === 'good') t.push('同期財運有支撐，付款能力較好');
      sec.push(['房產', esc(v.meanOf(tj)), t]);
    }

    // --- 貴人：化科、貴人星、天相吸來的祿 ---
    {
      const t = [], seen = new Set();
      [w, v].forEach((x) => x.tri.forEach((j) => {
        const s = sigOf(x, j), key = `${j}`;
        if (seen.has(key)) return;
        seen.add(key);
        // 對象 = 星的性質（男 / 女 / 長輩 / 同輩…）＋ 宮位的人（上司 / 父母 / 朋友…）
        const nm = namesOf(x)[j], where = PALACE_WHO[nm] || nm;
        const tag = `（${x.top.names ? x.top.title : '本命'}${nm}）`;
        s.gui.forEach((g) => t.push(`<b>${esc(g)}</b>${esc(tag)}：${esc(GUI_WHO[g])}；對象多半是${esc(where)}`));
        s.ke.forEach((k) => {
          const star = k.replace(/(生年|大限|流年)化科.*$/, '');
          t.push(`<b>${esc(k)}</b>${esc(tag)}：${esc(KE_WHO[star] || '有名聲、講道理的人')}；對象多半是${esc(where)}，在名聲、文書、考核上幫你`);
        });
      }));
      [w, v].forEach((x) => x.items.filter((i) => i.via === 'jia' && i.kind === 'lu').forEach((i) => {
        const nm = namesOf(x)[i.from];
        t.push(`<b>天相吸來${esc(i.label)}</b>：錢從${esc(PALACE_WHO[nm] || nm)}那邊來`);
      }));
      sec.push(['貴人', '財帛＋田宅三方四正', t.length ? t : ['三方四正貴人星不明顯，凡事靠自己比較穩']]);
    }

    // --- 破財可能性：化忌來源、空劫、煞星、雙忌 ---
    {
      const t = [], jiSet = new Set();
      // 先列直接落在三方四正的忌，再列天相吸來的忌（同一顆忌只寫一次）
      const allJi = [w, v].flatMap((x) => x.items.filter((i) => i.kind === 'ji').map((i) => [x, i]))
        .sort((p, q) => (p[1].via === 'jia') - (q[1].via === 'jia'));
      allJi.forEach(([x, i]) => {
        const j = i.via === 'jia' ? i.from : i.j;
        const key = i.label + j;
        if (jiSet.has(key)) return;
        jiSet.add(key);
        t.push(i.via === 'jia' ? `${esc(i.label)}（天相夾）：${esc(x.meanOf(j))}容易害你破財` : `${esc(i.label)}：${esc(x.meanOf(j))}方面容易破耗`);
      });
      const kong = w.kong || v.kong, jie = w.jie || v.jie;
      if (kong) t.push('地空：想法落空、錢財虛耗');
      if (jie) t.push('地劫：突發破耗');
      const sha = [...new Set([...w.sha, ...v.sha])];
      if (sha.length) t.push(`煞星：${L(sha)}`);
      const risk = jiSet.size + (kong ? 1 : 0) + (jie ? 1 : 0) + (w.big.length || v.big.length ? 2 : 0);
      const level = risk >= 5 ? '高' : risk >= 3 ? '中' : '低';
      sec.push([`破財可能性：${level}`, '化忌、空劫、煞星', t.length ? t : ['三方四正沒有化忌與空劫，破財機會低']]);
    }

    return `<div class="ana-domains"><h4>${esc(periodOf(r.layerKey))} 整體分面向解讀<small>（財運＋財庫合併判斷，不分按的是哪一顆）</small></h4>
      ${sec.map(([h, sub, t]) => `<div class="dom"><div class="dom-h">${esc(h)}<small>${sub}</small></div><ul>${t.map((x) => `<li>${x}</li>`).join('')}</ul></div>`).join('')}
    </div>`;
  }

  function anaHTML(r, other) {
    const { cfg, top, f, tri, ROLE, pname, meanOf, items, softs, sha, kong, jie, raw, score, big, care } = r;
    const a = state.astro;
    const { rating, rcls, bigName } = rateOf(r);
    const period = periodOf(r.layerKey);

    const topTitle = top.key === 'birth' ? '本命' : top.title;
    const P = [];
    const fp = a.palaces[f];
    // 1. 位置
    P.push(`<b>位置</b>：${topTitle}${cfg.target}落在 ${esc(pname(f))}。${esc(cfg.title)}${esc(cfg.role)}；這一層的${esc(cfg.target)}跟 ${esc(PALACE_MEAN[fp.name] || fp.name)}（本命${esc(fp.name)}）關係較大。`);
    // 2. 主星
    const mainStars = fp.majorStars.length ? fp.majorStars : a.palaces[(f + 6) % 12].majorStars;
    if (mainStars.length) {
      const tag = fp.majorStars.length ? '' : `（空宮，借對宮${esc(a.palaces[(f + 6) % 12].name)}）`;
      P.push(`<b>主星</b>${tag}：${mainStars.map((s) => `${esc(s.name)}＝${esc(STAR_MEAN[s.name] || '')}`).join('；')}。`);
    } else P.push('<b>主星</b>：本宮與對宮都沒有主星，財的性質看三合宮與運限四化。');
    // 3. 有利
    const good = [];
    items.filter((x) => x.kind === 'lu' && x.via !== 'jia').forEach((x) => good.push(`${esc(x.label)}（${esc(ROLE[tri.indexOf(x.j)])}${x.via === 'borrow' ? '・借星' : ''}）：${esc(STAR_MEAN[x.star] || '')}帶財`));
    items.filter((x) => x.kind === 'lucun').forEach((x) => good.push(`${esc(x.label)}（${esc(ROLE[tri.indexOf(x.j)])}）：財源有底，性質保守守財`));
    softs.forEach((x) => good.push(`${esc(x.label)}（${esc(ROLE[tri.indexOf(x.j)])}）：${x.k === 1 ? '有掌控力、主動爭取' : '名聲、文書、貴人帶財'}`));
    P.push(`<b>有利</b>：${good.length ? good.join('；') : '三方四正沒有祿、權、科，財來得比較辛苦'}。`);
    // 4. 不利
    const bad = [];
    items.filter((x) => x.kind === 'ji' && x.via !== 'jia').forEach((x) => bad.push(`${esc(x.label)}（${esc(ROLE[tri.indexOf(x.j)])}${x.via === 'borrow' ? '・借星' : ''}）：${esc(STAR_MEAN[x.star] || '')}方面容易出問題`));
    if (kong) bad.push('地空：想法落空、錢財虛耗');
    if (jie) bad.push('地劫：突發破耗、錢財被劫');
    sha.forEach((s) => bad.push(esc(s)));
    P.push(`<b>不利</b>：${bad.length ? bad.join('；') : '三方四正沒有化忌與煞星，相對乾淨'}。`);
    // 5. 天相夾
    const jl = items.filter((x) => x.via === 'jia');
    if (jl.length) {
      const lines = jl.map((x) => x.kind === 'lu'
        ? `${esc(x.label)} → 錢從「${esc(meanOf(x.from))}」來`
        : `${esc(x.label)} → 「${esc(meanOf(x.from))}」容易害你破財`);
      P.push(`<b>天相夾</b>：${lines.join('；')}。`);
    }
    // 6. 總結
    const SUM = {
      '財庫漏財': `${big.map(esc).join('、')}，財庫（存款、不動產、長期累積的資產）像有破洞，家底容易被消耗或縮水，累積比較辛苦。重點在守住已經存下來的部分，避免動用老本、為家庭或房產的事大額支出。`,
      '金流吃緊': `${big.map(esc).join('、')}，不一定是大賠，比較像現金流被卡住：支出、周轉壓力集中，手上可操作的資金很緊。避免高槓桿、借貸與作保，大額支出盡量分散時間點。`,
      '特別留意': `三方四正同時有地空、地劫，錢財容易虛耗或突發破耗，帳面上的好處要打折看。避免投機、衝動投資與借貸作保。`,
      '破財': '扣分大於加分，支出與破耗的壓力大於進帳，宜保守理財、控制開銷。',
      '偏弱': '有進帳但力道不足，適合穩定累積，不適合冒進。',
      '平穩': '有底但不算旺，穩健操作即可，留意不利項目提到的風險。',
      '良好': '財的條件不錯，可以積極爭取，但仍要避開不利項目的地雷。',
      '旺': '財的條件很旺，是可以主動出擊的時候。',
    };
    P.push(`<b>總結</b>：${SUM[rating]}${(kong || jie) ? ' 有地空或地劫，分數已經過修正，帳面看起來的好處容易打折。' : ''}`);

    const rows = (BASE ? [`<tr><td>基準</td><td></td><td class="pos">+${BASE}</td></tr>`] : [])
      .concat(items.map((x) => `<tr><td>${esc(x.label)}</td><td>${esc(x.where)}</td><td class="${x.pts >= 0 ? 'pos' : 'neg'}">${x.pts >= 0 ? '+' : ''}${fmt(x.pts)}</td></tr>`));
    rows.push(`<tr class="sub"><td>小計</td><td></td><td>${fmt(raw)}</td></tr>`);
    if (kong || jie) rows.push(`<tr><td>${kong && jie ? '地空＋地劫' : kong ? '地空' : '地劫'}修正</td><td>${raw > 0 ? '分數 > 0 時 × 0.3' : raw < 0 ? '分數 < 0 時 × 1.7' : '分數為 0，不變'}</td><td>${fmt(score)}</td></tr>`);
    if (!items.length) rows.push(`<tr><td colspan="3">三方四正沒有祿、忌、祿存</td></tr>`);
    rows.push(`<tr class="sub"><td>總分</td><td></td><td>${fmt(score)}</td></tr>`);
    return `<section class="ana" aria-label="${esc(period)}${esc(cfg.title)}分析">
      <div class="ana-head">
        <h3>${esc(period)} ${esc(cfg.title)}分析・${esc(topTitle)}${esc(cfg.target)}</h3>
        <div class="ana-score ${rcls}" aria-label="${esc(cfg.title)}總分"><span>${score > 0 ? '+' : ''}${fmt(score)}</span><small> 分</small></div>
        <span class="ana-rating ${rcls}">${rating}</span>
      </div>
      ${big.map((b) => `<div class="ana-warn" role="alert">⚠ ${bigName}：${esc(b)}</div>`).join('')}
      ${care.map((b) => `<div class="ana-warn care" role="alert">⚠ 特別留意：${esc(b)}</div>`).join('')}
      <div class="ana-body">
        <div class="ana-text">${P.map((t) => `<p>${t}</p>`).join('')}</div>
        <table class="ana-table"><thead><tr><th>項目</th><th>位置</th><th>分數</th></tr></thead><tbody>${rows.join('')}</tbody></table>
      </div>
      ${other ? comboHTML(r, other) : ''}
      ${other ? domainsHTML(r, other) : ''}
      <p class="ana-note">計分：基準 ${BASE}；化祿 +5（貪狼化祿 +${TANLANG_LU}）、化忌 −5、祿存 +3；空宮借對宮折半；天相吸左右鄰宮的祿忌；有地空或地劫時，分數 &gt; 0 × 0.3、&lt; 0 × 1.7。
        計分層：${r.layers.map((L) => L.title).join('、')}。流月不計分。權、科只寫入解讀，不計分。
        評語：&lt; 0 破財、0~3 偏弱、3~8 平穩、8~15 良好、15 以上旺。</p>
    </section>`;
  }

  function render() {
    const a = state.astro, sc = scopes();
    // 分析模式：三方四正自動對到目前最上層的財帛 / 田宅
    let ana = null;
    // 取消了大限 / 流年，對應層級的分析就失效
    if (state.ana && ((state.ana.layer === 'dec' && state.sel.dec == null) || (state.ana.layer === 'year' && state.sel.year == null))) state.ana = null;
    if (state.ana) {
      ana = analyze(state.ana.kind, state.ana.layer);
      if (ana.f >= 0) state.focus = ana.f; else ana = null;
    }
    const palaces = a.palaces.map((p, i) => palaceHTML(p, i, sc)).join('');
    // 同一層的另一半（財運 ↔ 財庫）一起算，用來寫綜合解讀
    const other = ana ? analyze(ana.kind === 'wealth' ? 'vault' : 'wealth', state.ana.layer) : null;
    $('out').innerHTML = `<div class="chart-scroll"><div class="chart">${palaces}${centerHTML()}${linesSVG()}</div>${yunHTML()}</div>${ana ? anaHTML(ana, other && other.f >= 0 ? other : null) : ''}`;
  }

  $('out').addEventListener('click', (e) => {
    if (!state) return;
    const t = e.target.closest('[data-ana],[data-dec],[data-year],[data-month],[data-palace]');
    if (!t) return;
    if (t.dataset.ana != null) {
      const { ana: kind, layer } = t.dataset;
      const same = state.ana && state.ana.kind === kind && state.ana.layer === layer;
      state.ana = same ? null : { kind, layer };
      render();
      if (!same) document.querySelector('.ana')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else if (t.dataset.dec != null) selectDecade(+t.dataset.dec);
    else if (t.dataset.year != null) {
      const y = +t.dataset.year;
      if (state.sel.year === y) { state.sel.year = null; state.sel.month = null; computeAndRender(); }
      else { state.sel.year = y; state.sel.month = null; computeAndRender(); }
    } else if (t.dataset.month != null) {
      const m = +t.dataset.month;
      state.sel.month = state.sel.month === m ? null : m;
      computeAndRender();
    } else if (t.dataset.palace != null) {
      state.ana = null; // 手動點宮位就離開分析模式
      state.focus = +t.dataset.palace;
      render();
    }
  });
  $('out').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.palace != null) { e.preventDefault(); e.target.click(); }
  });

  /* ===== 字型切換（記在 localStorage） ===== */
  const FONT_KEY = 'ziwei_font_v1';
  const FONTS = ['ming', 'kai', 'hei'];
  function applyFont(f) {
    if (!FONTS.includes(f)) f = 'ming';
    if (f === 'ming') delete document.documentElement.dataset.font;
    else document.documentElement.dataset.font = f;
    document.querySelectorAll('#fontbar button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.font === f)));
    try { localStorage.setItem(FONT_KEY, f); } catch { /* 無痕模式等情況忽略 */ }
  }
  $('fontbar').addEventListener('click', (e) => {
    const f = e.target.closest('button[data-font]')?.dataset.font;
    if (f) applyFont(f);
  });
  try { applyFont(localStorage.getItem(FONT_KEY) || 'ming'); } catch { applyFont('ming'); }

  renderProfiles();
})();
</script>
</body>
</html>
